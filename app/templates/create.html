{% extends "base.html" %}

{% block title %}New Note - Markdown Notes App{% endblock %}

{% block content %}
<style>
    .form-container {
        max-width: 800px;
        margin: 0 auto;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 2rem;
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: var(--text-primary);
        font-size: 0.95rem;
    }

    .form-input, .form-textarea {
        width: 100%;
        background: #090d16;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 0.75rem 1rem;
        color: #fff;
        font-size: 1rem;
        font-family: inherit;
        transition: border-color 0.2s ease;
    }

    .form-textarea {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.95rem;
        min-height: 250px;
        resize: vertical;
        line-height: 1.6;
    }

    .form-input:focus, .form-textarea:focus {
        outline: none;
        border-color: var(--accent-primary);
        box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .markdown-hints {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 0.5rem;
        font-size: 0.8rem;
        color: var(--text-muted);
    }

    .hint-tag {
        background: rgba(255, 255, 255, 0.05);
        padding: 0.2rem 0.5rem;
        border-radius: 4px;
        font-family: 'JetBrains Mono', monospace;
    }

    .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 1rem;
        margin-top: 2rem;
    }
</style>

<div class="form-container">
    <h1 style="font-size: 1.5rem; margin-bottom: 1.5rem;">📝 Create New Note</h1>

    <form action="{{ url_for('create_note') }}" method="POST">
        <div class="form-group">
            <label for="title" class="form-label">Note Title</label>
            <input type="text" id="title" name="title" class="form-input" placeholder="e.g. CI/CD Architecture Notes" required autofocus>
        </div>

        <div class="form-group">
            <label for="content" class="form-label">Markdown Content</label>
            <textarea id="content" name="content" class="form-textarea" placeholder="Type markdown content here...&#10;&#10;# Heading 1&#10;**Bold text**&#10;- [x] Task 1&#10;- [ ] Task 2&#10;&#10;```python&#10;print('Hello DevOps!')&#10;```" required></textarea>
            
            <div class="markdown-hints">
                <span>Markdown supported:</span>
                <span class="hint-tag"># Heading</span>
                <span class="hint-tag">**Bold**</span>
                <span class="hint-tag">*Italic*</span>
                <span class="hint-tag">`code`</span>
                <span class="hint-tag">```codeblock```</span>
                <span class="hint-tag">- Lists</span>
                <span class="hint-tag">| Tables |</span>
            </div>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Note</button>
        </div>
    </form>
</div>
{% endblock %}
