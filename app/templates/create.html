{% extends "base.html" %}

{% block title %}New Note - Markdown Notes App{% endblock %}

{% block content %}
<style>
    .editor-container {
        max-width: 860px;
        margin: 0 auto;
        background: var(--surface-1);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-lg);
        padding: 2rem;
        box-shadow: var(--shadow-md);
    }

    .editor-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.75rem;
        border-bottom: 1px solid var(--border-subtle);
        padding-bottom: 1rem;
    }

    .editor-title {
        font-size: 1.35rem;
        font-weight: 700;
        color: var(--text-main);
        letter-spacing: -0.01em;
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: var(--text-main);
        font-size: 0.875rem;
    }

    .form-input {
        width: 100%;
        background: #030712;
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-sm);
        padding: 0.75rem 1rem;
        color: var(--text-main);
        font-size: 0.95rem;
        font-family: inherit;
        transition: var(--transition);
        outline: none;
    }

    .form-input:focus {
        border-color: var(--border-focus);
        box-shadow: 0 0 0 3px var(--accent-glow);
    }

    /* Tabbed Write / Preview Bar */
    .editor-tabs-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.5rem;
        flex-wrap: wrap;
        gap: 0.5rem;
    }

    .tab-group {
        display: inline-flex;
        background: var(--surface-2);
        padding: 0.2rem;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-subtle);
    }

    .tab-btn {
        background: transparent;
        border: none;
        color: var(--text-muted);
        padding: 0.35rem 0.85rem;
        border-radius: 4px;
        font-size: 0.8rem;
        font-weight: 500;
        cursor: pointer;
        transition: var(--transition);
    }

    .tab-btn.active {
        background: var(--accent);
        color: #ffffff;
        box-shadow: var(--shadow-sm);
    }

    /* Markdown Formatting Quick Chips */
    .toolbar-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
    }

    .chip-btn {
        background: var(--surface-2);
        border: 1px solid var(--border-subtle);
        color: var(--text-muted);
        padding: 0.25rem 0.55rem;
        border-radius: 4px;
        font-size: 0.75rem;
        font-family: 'JetBrains Mono', monospace;
        cursor: pointer;
        transition: var(--transition);
    }

    .chip-btn:hover {
        background: var(--surface-3);
        color: var(--text-main);
        border-color: var(--border-hover);
    }

    .form-textarea {
        width: 100%;
        background: #030712;
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-sm);
        padding: 0.85rem 1rem;
        color: var(--text-main);
        font-size: 0.9rem;
        font-family: 'JetBrains Mono', monospace;
        min-height: 260px;
        resize: vertical;
        line-height: 1.6;
        transition: var(--transition);
        outline: none;
    }

    .form-textarea:focus {
        border-color: var(--border-focus);
        box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .live-preview-box {
        display: none;
        width: 100%;
        background: #030712;
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-sm);
        padding: 1.25rem;
        min-height: 260px;
        overflow-y: auto;
    }

    .form-actions {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 0.75rem;
        margin-top: 2rem;
        border-top: 1px solid var(--border-subtle);
        padding-top: 1.25rem;
    }

    @media (max-width: 640px) {
        .editor-container {
            padding: 1.25rem;
        }
        .editor-tabs-bar {
            flex-direction: column;
            align-items: flex-start;
        }
    }
</style>

<div class="editor-container">
    <div class="editor-header">
        <h1 class="editor-title">📝 Create New Note</h1>
        <a href="{{ url_for('index') }}" class="btn btn-ghost btn-sm">← Back</a>
    </div>

    <form action="{{ url_for('create_note') }}" method="POST">
        <!-- Title Input -->
        <div class="form-group">
            <label for="title" class="form-label">
                <span>Note Title</span>
                <span style="font-weight: 400; color: var(--text-faint); font-size: 0.75rem;">Required</span>
            </label>
            <input type="text" id="title" name="title" class="form-input" placeholder="e.g. CI/CD Architecture Notes" required autofocus>
        </div>

        <!-- Markdown Content Editor -->
        <div class="form-group">
            <div class="editor-tabs-bar">
                <div class="tab-group" role="tablist">
                    <button type="button" class="tab-btn active" id="writeTab" onclick="switchEditorTab('write')">Write</button>
                    <button type="button" class="tab-btn" id="previewTab" onclick="switchEditorTab('preview')">Live Preview</button>
                </div>

                <div class="toolbar-chips" id="formattingToolbar">
                    <button type="button" class="chip-btn" onclick="insertSyntax('# ', '')"># H1</button>
                    <button type="button" class="chip-btn" onclick="insertSyntax('## ', '')">## H2</button>
                    <button type="button" class="chip-btn" onclick="insertSyntax('**', '**')">**Bold**</button>
                    <button type="button" class="chip-btn" onclick="insertSyntax('*', '*')">*Italic*</button>
                    <button type="button" class="chip-btn" onclick="insertSyntax('`', '`')">`Code`</button>
                    <button type="button" class="chip-btn" onclick="insertSyntax('```\n', '\n```')">```Block```</button>
                    <button type="button" class="chip-btn" onclick="insertSyntax('- ', '')">- List</button>
                    <button type="button" class="chip-btn" onclick="insertSyntax('| Col 1 | Col 2 |\n|---|---|\n| Val 1 | Val 2 |\n', '')">Table</button>
                </div>
            </div>

            <!-- Write Textarea -->
            <textarea id="content" name="content" class="form-textarea" placeholder="Type markdown content here...&#10;&#10;# Heading 1&#10;**Bold text**&#10;- [x] Task 1&#10;- [ ] Task 2&#10;&#10;```python&#10;print('Hello DevOps!')&#10;```" required></textarea>

            <!-- Live Preview Container -->
            <div id="previewBox" class="live-preview-box markdown-body"></div>
        </div>

        <!-- Action Buttons -->
        <div class="form-actions">
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Note</button>
        </div>
    </form>
</div>

<!-- Client-side Markdown Live Preview & Toolbar Script -->
<script>
    function insertSyntax(prefix, suffix) {
        const textarea = document.getElementById('content');
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const selected = textarea.value.substring(start, end);
        const replacement = prefix + selected + suffix;
        textarea.value = textarea.value.substring(0, start) + replacement + textarea.value.substring(end);
        textarea.focus();
        textarea.setSelectionRange(start + prefix.length, end + prefix.length);
    }

    function simpleMarkdownParse(md) {
        if (!md.trim()) return '<p style="color: var(--text-faint); font-style: italic;">Nothing to preview yet.</p>';
        let html = md
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/^### (.*$)/gim, '<h3>$1</h3>')
            .replace(/^## (.*$)/gim, '<h2>$1</h2>')
            .replace(/^# (.*$)/gim, '<h1>$1</h1>')
            .replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/gim, '<em>$1</em>')
            .replace(/```([a-z]*)\n([\s\S]*?)```/gim, '<pre><code>$2</code></pre>')
            .replace(/`([^`]+)`/gim, '<code>$1</code>')
            .replace(/^\- (.*$)/gim, '<ul><li>$1</li></ul>')
            .replace(/\n$/gim, '<br>');
        return html;
    }

    function switchEditorTab(tab) {
        const writeTab = document.getElementById('writeTab');
        const previewTab = document.getElementById('previewTab');
        const textarea = document.getElementById('content');
        const previewBox = document.getElementById('previewBox');
        const toolbar = document.getElementById('formattingToolbar');

        if (tab === 'write') {
            writeTab.classList.add('active');
            previewTab.classList.remove('active');
            textarea.style.display = 'block';
            previewBox.style.display = 'none';
            toolbar.style.display = 'flex';
        } else {
            previewTab.classList.add('active');
            writeTab.classList.remove('active');
            textarea.style.display = 'none';
            previewBox.style.display = 'block';
            toolbar.style.display = 'none';
            previewBox.innerHTML = simpleMarkdownParse(textarea.value);
        }
    }
</script>
{% endblock %}
