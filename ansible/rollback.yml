---
- name: Automated Rollback Handler
  block:
    - name: Announce Rollback
      ansible.builtin.debug:
        msg: "🔄 Reverting Staging to previous known-good image tag: {{ previous_image_tag }}"

    - name: Stop failed staging container
      ansible.builtin.shell: |
        docker compose -f docker-compose.yml -f compose.staging.yml down
      ignore_errors: true

    - name: Restart staging stack with previous known-good configuration
      ansible.builtin.shell: |
        docker compose -f docker-compose.yml -f compose.staging.yml up -d
      environment:
        APP_PORT: "{{ staging_port }}"
        FLASK_ENV: "staging"

    - name: Verify recovered container is operational
      ansible.builtin.uri:
        url: "{{ health_endpoint }}"
        method: GET
        status_code: 200
      register: recovery_check
      until: recovery_check.status == 200
      retries: 5
      delay: 2

    - name: Rollback Confirmation
      ansible.builtin.debug:
        msg: "🛡️ Rollback SUCCESS: Staging service restored to previous healthy state."
