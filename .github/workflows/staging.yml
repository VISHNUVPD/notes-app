name: Staging Continuous Deployment

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy-to-staging:
    name: Deploy to Staging & Run Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Update CHANGELOG.md Automatically
        run: |
          python scripts/update_changelog.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): auto-update CHANGELOG.md [skip ci]" || echo "No changelog changes"

      - name: Run Ansible Staging Deployment with Automated Smoke Test & Rollback
        env:
          IMAGE_TAG: "staging-${{ github.sha }}"
          PREVIOUS_IMAGE_TAG: "staging-latest"
        run: |
          ansible-playbook ansible/deploy.yml \
            -e "image_tag=staging-${{ github.sha }}" \
            -e "previous_image_tag=staging-latest"
