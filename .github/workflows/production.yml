name: Production Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic Version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  production-approval-gate:
    name: Production Manual Approval Gate
    runs-on: ubuntu-latest
    environment: production  # Requires manual approval in GitHub repo settings

    steps:
      - name: Confirm Manual Approval
        run: |
          echo "✅ Production deployment approved by release manager."
          echo "Target Release Version: ${{ github.event.inputs.version || github.ref_name }}"

  publish-and-deploy-prod:
    name: Tag SemVer Image & Deploy Production
    needs: production-approval-gate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Semantic Version Tag
        id: version_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=v1.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Build & Publish Production Images (:v1.0.0 and :latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version_tag.outputs.VERSION }}
            ghcr.io/${{ github.repository }}:latest

      - name: Deploy Production Stack
        run: |
          docker compose -f docker-compose.yml -f compose.prod.yml down
          docker compose -f docker-compose.yml -f compose.prod.yml up -d --build
